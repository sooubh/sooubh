<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gully Cricket</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .emoji { font-size: 5rem; margin-bottom: 16px; }
    h1 { font-size: 2.5rem; font-weight: 800; color: #ffb300; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 1.1rem; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn-primary {
      background: #2e7d32;
      color: #fff;
    }
    .btn-secondary {
      border: 1px solid #30363d;
      color: #8b949e;
      background: #161b22;
    }
    .badge {
      margin-top: 40px;
      color: #484f58;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="emoji">🏏</div>
  <h1>GULLY CRICKET</h1>
  <p>Make every street match feel like IPL scoring</p>

  <div class="links">
    <a href="https://play.google.com/store/apps/details?id=com.sooubh.gullycricket" class="btn-primary">
      📱 Download on Play Store
    </a>
    <a href="/privacy-policy" class="btn-secondary">
      🔒 Privacy Policy
    </a>
  </div>

  <p class="badge">Built by Sooubh · sourabh3527@gmail.com · India 🇮🇳</p>
</body>
</html>
